[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexonomy"
description = "Dexonomy: Synthesizing All Dexterous Grasp Types in a Grasp Taxonomy"
version = "0.0.1"
authors = [{name = "Jiayi Chen", email = "jiayichen@pku.edu.cn"}]
dependencies = [
    "torch==2.8.0+cu128",
    "numpy==2.2.6",
    "warp-lang==1.8.0",
    "mujoco==3.3.3",
    "trimesh[easy]==4.5.3",
    "matplotlib==3.10.3",
    "imageio==2.37.0",
    "qpsolvers[clarabel]==4.8.0",
    "transforms3d==0.4.2",
    "hydra-core==1.3.2",
    "usd-core==25.2",
    "ruamel.yaml==0.18.10",
    "viser>=1.1.1,<2",
]

[tool.setuptools]
packages = ["dexonomy"]

[project.scripts]
dexkill = "dexonomy.kill:main"
dexrun = "dexonomy.main:main"     # Single-operation runner
dexsyn = "dexonomy.script:main"  # Full pipeline runner
dexsyn_admm = "dexonomy.script_admm:main"  # Full pipeline runner

[tool.pixi.workspace]
channels = ["https://mirrors.ustc.edu.cn/anaconda/cloud/conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.10.*"

[tool.pixi.pypi-options]
index-url = "https://mirrors.ustc.edu.cn/pypi/simple"
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]

[tool.pixi.tasks]
dexrun = "python -m dexonomy.main"
dexsyn = "python -m dexonomy.script"
dexsyn-admm = "python -m dexonomy.script_admm"
sharpa-template-editor = "python -m tools.sharpa_template_editor"
sharpa-grasp-viewer = "python -m tools.sharpa_grasp_viewer"
